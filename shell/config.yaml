model_parameters:
  onnx_model: '../my_workspace/test.onnx'
  march: 'bayes-e'
  output_model_file_prefix: 'test'
  working_dir: '../my_workspace'

input_parameters:
  input_name: 'images'
  input_shape: '1x3x736x736'
  input_layout_train: 'NCHW'
  input_type_train: 'bgr'
  input_type_rt: 'nv12'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451

calibration_parameters:
  cal_data_dir: '../my_workspace/pictures'
  preprocess_on: True
  cal_data_type: 'float32'

compiler_parameters:
  optimize_level: 'O3'
